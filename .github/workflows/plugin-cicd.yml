name: Plugin CI/CD

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  plugin-ci:
    uses: BigStartByXuyb/cicd/.github/workflows/plugin-marketplace.yml@c1c1f69443b5dbf654249929d464712422027e7e
    with:
      ci_ref: c1c1f69443b5dbf654249929d464712422027e7e
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_DEFAULT_CHAT_ID: ${{ secrets.FEISHU_DEFAULT_CHAT_ID }}
      FEISHU_RECIPIENT_MAP_JSON: ${{ secrets.FEISHU_RECIPIENT_MAP_JSON }}
